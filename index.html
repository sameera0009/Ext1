<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>KPI Card Pro</title>
  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --a:  #6C63FF;
      --a2: #3ECFCF;
      --pos: #10b981;
      --neg: #ef4444;
      --bar-h: 5px;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Syne', sans-serif;
      background: #f0f1f6;
      display: flex; align-items: center; justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      width: min(340px, 96vw);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 10px 36px rgba(0,0,0,0.10);
    }

    .top-bar {
      height: var(--bar-h);
      background: linear-gradient(90deg, var(--a), var(--a2));
    }

    .body { padding: 18px 20px 16px; }

    /* header row */
    .hrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .klabel {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: #9898ac; flex: 1; line-height: 1.5;
    }
    .badge-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .dtag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: #9898ac;
      background: #f4f3fc; padding: 2px 8px; border-radius: 20px;
    }
    .vbadge {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 600;
      padding: 3px 8px 3px 5px; border-radius: 20px;
    }
    .vbadge.up   { background: #e7faf2; color: var(--pos); }
    .vbadge.down { background: #fef1f1; color: var(--neg); }
    .vbadge svg  { width: 11px; height: 11px; }

    /* hero */
    .hero {
      font-size: clamp(30px, 9vw, 44px); font-weight: 800;
      color: #111827; letter-spacing: -2px; line-height: 1;
      margin: 4px 0 5px;
      font-feature-settings: "tnum";
    }

    /* mom */
    .mrow { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
    .mdelta { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
    .mdelta.up   { color: var(--pos); }
    .mdelta.down { color: var(--neg); }
    .mlabel { font-size: 11px; color: #b0b0c0; }

    /* chart */
    .cwrap { width: 100%; }
    svg.spark { width: 100%; display: block; overflow: visible; }
    .xlabs { display: flex; justify-content: space-between; padding: 3px 2px 0; }
    .xlabs span { font-size: 9px; color: #cccce0; font-weight: 600; }

    /* tooltip */
    .tt {
      position: fixed; pointer-events: none; opacity: 0;
      background: #18182e; color: #fff;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 6px 11px; border-radius: 8px; z-index: 999;
      white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.28);
      transition: opacity .1s;
    }

    /* empty state */
    .empty {
      padding: 28px 20px; text-align: center;
      font-size: 12px; color: #c0c0d0; line-height: 1.9;
      display: none;
    }
    .empty strong { color: var(--a); }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="top-bar" id="topBar"></div>
  <div class="body" id="cardBody">
    <div class="hrow">
      <span class="klabel" id="klabel">—</span>
      <div class="badge-wrap">
        <span class="dtag" id="dtag"></span>
        <span class="vbadge up" id="vbadge">
          <svg id="vicon" viewBox="0 0 12 12" fill="none">
            <path d="M6 9V3M6 3L3 6M6 3l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="vpct">—</span>
        </span>
      </div>
    </div>
    <div class="hero" id="hero">—</div>
    <div class="mrow" id="mrow">
      <span class="mdelta up" id="mdelta">—</span>
      <span class="mlabel">vs previous period</span>
    </div>
    <div class="cwrap" id="cwrap">
      <svg class="spark" id="spark" height="70"></svg>
      <div class="xlabs" id="xlabs"></div>
    </div>
  </div>
  <div class="empty" id="empty">
    Drop a <strong>Measure</strong> on <em>KPI</em><br>
    and a <strong>Date</strong> on <em>Time</em>
  </div>
</div>
<div class="tt" id="tt"></div>

<script>
'use strict';
(function () {

  const PALETTES = [
    { a:'#6C63FF', b:'#3ECFCF' },
    { a:'#FF6B6B', b:'#FF9A3C' },
    { a:'#10b981', b:'#34d399' },
    { a:'#3B82F6', b:'#8B5CF6' },
    { a:'#F59E0B', b:'#FCD34D' },
    { a:'#EC4899', b:'#6366F1' },
    { a:'#14b8a6', b:'#0ea5e9' },
    { a:'#f43f5e', b:'#fb7185' },
  ];

  // Default settings — overridden by saved config
  let CFG = {
    title:      '',
    pal:        0,
    chartType:  'area',
    chartH:     70,
    barH:       5,
    showDate:   true,
    showVar:    true,
    showMom:    true,
    showChart:  true,
  };

  let sparkPts = [];
  let ws;

  /* ── LOAD SAVED SETTINGS ── */
  function loadCfg() {
    try {
      const raw = tableau.extensions.settings.get('kpiCfg');
      if (raw) Object.assign(CFG, JSON.parse(raw));
    } catch {}
  }

  /* ── APPLY PALETTE / STYLES ── */
  function applyStyle() {
    const p = PALETTES[CFG.pal] || PALETTES[0];
    document.documentElement.style.setProperty('--a',  p.a);
    document.documentElement.style.setProperty('--a2', p.b);
    document.documentElement.style.setProperty('--bar-h', CFG.barH + 'px');
  }

  /* ── TABLEAU INIT ── */
  window.onload = function () {
    tableau.extensions.initializeAsync({ configure: openConfig }).then(() => {
      ws = tableau.extensions.worksheetContent.worksheet;
      loadCfg();
      applyStyle();

      const go = () => load(ws);
      ws.addEventListener(tableau.TableauEventType.SummaryDataChanged, go);
      window.addEventListener('resize', () => { if (sparkPts.length) drawChart(); });

      // Re-render when config dialog closes with saved settings
      tableau.extensions.settings.addEventListener(
        tableau.TableauEventType.SettingsChanged,
        () => { loadCfg(); applyStyle(); if (sparkPts.length) renderCard._last && renderCard(...renderCard._last); load(ws); }
      );

      go();
    }).catch(showEmpty);
  };

  function openConfig() {
    const url = window.location.href.replace('index.html', 'config.html');
    tableau.extensions.ui.displayDialogAsync(url, '', { width: 420, height: 560 })
      .catch(() => {});
  }

  /* ── DATA ── */
  async function load(wsObj) {
    try {
      const [rows, enc] = await Promise.all([readRows(wsObj), readEnc(wsObj)]);
      renderCard(rows, enc);
    } catch { showEmpty(); }
  }

  async function readRows(wsObj) {
    let rows = [];
    const r = await wsObj.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });
    for (let i = 0; i < r.pageCount; i++) {
      const pg = await r.getPageAsync(i);
      pg.data.forEach(row => {
        const o = {};
        pg.columns.forEach((c, idx) => { o[c.fieldName] = row[idx]; });
        rows.push(o);
      });
    }
    await r.releaseAsync();
    return rows;
  }

  async function readEnc(wsObj) {
    const spec = await wsObj.getVisualSpecificationAsync();
    const map = {};
    if (spec.activeMarksSpecificationIndex < 0) return map;
    const m = spec.marksSpecifications[spec.activeMarksSpecificationIndex];
    m.encodings.forEach(e => { map[e.id] = e.field; });
    return map;
  }

  /* ── RENDER ── */
  function renderCard(rows, enc) {
    renderCard._last = [rows, enc];
    if (!enc.kpi || rows.length === 0) { showEmpty(); return; }
    hideEmpty();

    const vf = enc.kpi.name;
    const tf = enc.time ? enc.time.name : null;

    // Custom title from config, fallback to field name (cleaned)
    const rawTitle = CFG.title.trim() || vf.replace(/^(sum|avg|count|min|max)\((.+)\)$/i, '$2');
    document.getElementById('klabel').textContent = rawTitle;

    let series = rows.map(r => ({
      v: parseFloat(r[vf]?.nativeValue) || 0,
      t: tf ? (r[tf]?.formattedValue || '') : ''
    }));
    if (tf) series.sort((a, b) => a.t.localeCompare(b.t, undefined, { numeric: true }));

    const vals = series.map(s => s.v);
    const labs = series.map(s => s.t);
    const last = vals.at(-1) || 0;
    const prev = vals.length > 1 ? vals.at(-2) : null;

    // Date tag
    const dtEl = document.getElementById('dtag');
    dtEl.textContent = labs.at(-1) || '';
    dtEl.style.display = (CFG.showDate && labs.at(-1)) ? '' : 'none';

    // Hero
    document.getElementById('hero').textContent = fmt(last);

    // Variance + MoM
    if (prev !== null) {
      const diff = last - prev;
      const pct  = prev !== 0 ? (diff / Math.abs(prev)) * 100 : 0;
      const up   = diff >= 0;

      const badge = document.getElementById('vbadge');
      badge.className = 'vbadge ' + (up ? 'up' : 'down');
      document.getElementById('vpct').textContent = (up ? '+' : '') + pct.toFixed(1) + '%';
      document.getElementById('vicon').innerHTML = up
        ? '<path d="M6 9V3M6 3L3 6M6 3l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M6 3v6M6 9L3 6m3 3l3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';

      const md = document.getElementById('mdelta');
      md.className = 'mdelta ' + (up ? 'up' : 'down');
      md.textContent = (up ? '▲ +' : '▼ ') + fmt(Math.abs(diff)) + '  (' + (up ? '+' : '') + pct.toFixed(1) + '%)';
    }

    document.getElementById('vbadge').style.display = CFG.showVar   ? '' : 'none';
    document.getElementById('mrow').style.display   = CFG.showMom   ? '' : 'none';
    document.getElementById('cwrap').style.display  = CFG.showChart ? '' : 'none';

    // X labels
    const xl = document.getElementById('xlabs');
    xl.innerHTML = '';
    if (labs.length > 1) {
      [labs[0], labs[Math.floor(labs.length / 2)], labs.at(-1)].filter(Boolean).forEach(l => {
        const sp = document.createElement('span'); sp.textContent = l; xl.appendChild(sp);
      });
    }

    sparkPts = vals.map((v, i) => ({ v, label: labs[i] || String(i + 1) }));
    drawChart();
  }

  /* ── CHART ── */
  function drawChart() {
    const svgEl = document.getElementById('spark');
    const wrap  = document.getElementById('cwrap');
    if (!CFG.showChart) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';

    const H = CFG.chartH;
    svgEl.setAttribute('height', H);
    d3.select(svgEl).selectAll('*').remove();
    if (sparkPts.length < 2) return;

    const W   = svgEl.clientWidth || 300;
    const pad = { t:6, r:6, b:4, l:6 };
    const vs  = sparkPts.map(d => d.v);
    const pa  = PALETTES[CFG.pal] || PALETTES[0];
    const xSc = d3.scaleLinear().domain([0, vs.length - 1]).range([pad.l, W - pad.r]);
    const mn  = d3.min(vs), mx = d3.max(vs), mg = (mx - mn) * 0.1 || 1;
    const ySc = d3.scaleLinear().domain([mn - mg, mx + mg]).range([H - pad.b, pad.t]);
    const svg = d3.select(svgEl);
    const uid = 'g' + Date.now();
    const curve = d3.curveCatmullRom.alpha(0.5);

    if (CFG.chartType === 'bar') {
      const bw = Math.max(3, (W - pad.l - pad.r) / vs.length * 0.62);
      svg.selectAll('rect').data(vs).enter().append('rect')
        .attr('x', (_, i) => xSc(i) - bw / 2).attr('y', d => ySc(d))
        .attr('width', bw).attr('height', d => (H - pad.b) - ySc(d))
        .attr('rx', 3)
        .attr('fill', (_, i) => i === vs.length - 1 ? pa.a : pa.b + '99');
    } else {
      const defs = svg.append('defs');
      const gr = defs.append('linearGradient').attr('id', uid)
        .attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
      gr.append('stop').attr('offset','0%').attr('stop-color', pa.a).attr('stop-opacity', 0.36);
      gr.append('stop').attr('offset','100%').attr('stop-color', pa.b).attr('stop-opacity', 0.0);

      if (CFG.chartType === 'area') {
        svg.append('path').datum(vs)
          .attr('d', d3.area().x((_, i) => xSc(i)).y0(H - pad.b).y1(d => ySc(d)).curve(curve))
          .attr('fill', `url(#${uid})`);
      }
      svg.append('path').datum(vs)
        .attr('d', d3.line().x((_, i) => xSc(i)).y(d => ySc(d)).curve(curve))
        .attr('fill', 'none').attr('stroke', pa.a).attr('stroke-width', 2.5).attr('stroke-linecap', 'round');

      svg.append('circle')
        .attr('cx', xSc(vs.length - 1)).attr('cy', ySc(vs.at(-1))).attr('r', 4)
        .attr('fill', pa.a).attr('stroke', '#fff').attr('stroke-width', 2);
    }

    // Hover
    const tt = document.getElementById('tt');
    const vl = svg.append('line').attr('y1', pad.t).attr('y2', H - pad.b)
      .attr('stroke', '#d8d7ee').attr('stroke-width', 1).attr('stroke-dasharray', '3,2').style('opacity', 0);
    const vd = svg.append('circle').attr('r', 4)
      .attr('fill', pa.a).attr('stroke', '#fff').attr('stroke-width', 2).style('opacity', 0);
    svg.append('rect').attr('width', W).attr('height', H).attr('fill', 'transparent').style('cursor', 'crosshair')
      .on('mousemove', function (e) {
        const [mx] = d3.pointer(e, svgEl);
        const ci = Math.max(0, Math.min(vs.length - 1, Math.round(xSc.invert(mx))));
        vl.attr('x1', xSc(ci)).attr('x2', xSc(ci)).style('opacity', 1);
        vd.attr('cx', xSc(ci)).attr('cy', ySc(vs[ci])).style('opacity', 1);
        tt.style('opacity', 1)
          .style('left', (e.clientX + 14) + 'px').style('top', (e.clientY - 32) + 'px')
          .innerHTML = `<b>${sparkPts[ci].label}</b>&nbsp;&nbsp;${fmt(vs[ci])}`;
      })
      .on('mouseleave', () => { vl.style('opacity', 0); vd.style('opacity', 0); tt.style('opacity', 0); });
  }

  /* ── UTILS ── */
  function fmt(v) {
    if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
  }
  function showEmpty() { document.getElementById('cardBody').style.display = 'none'; document.getElementById('empty').style.display = 'block'; }
  function hideEmpty() { document.getElementById('cardBody').style.display = ''; document.getElementById('empty').style.display = 'none'; }

})();
</script>
</body>
</html>
