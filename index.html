<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Gradient Donut</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api-js@main/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: transparent; overflow: hidden; }
        #chart { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .center-val { text-anchor: middle; font-weight: 800; fill: #333; }
        .center-label { text-anchor: middle; font-size: 14px; fill: #999; text-transform: uppercase; }
        path { transition: transform 0.2s ease; cursor: pointer; }
        path:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        // Initialize the extension
        tableau.extensions.initializeAsync().then(() => {
            const render = async () => {
                const worksheet = tableau.extensions.dashboardContent.dashboard.worksheets[0];
                const dataTable = await worksheet.getSummaryDataAsync();
                
                // Map Data (Col 0: Dimension, Col 1: Measure)
                const data = dataTable.data.map(d => ({
                    label: d[0].formattedValue,
                    value: d[1].value
                }));

                const width = window.innerWidth, height = window.innerHeight;
                const radius = Math.min(width, height) / 2 - 40;

                d3.select("#chart").selectAll("*").remove();
                const svg = d3.select("#chart").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", `translate(${width/2},${height/2})`);

                // Modern UI Color Palette
                const palette = ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948"];

                // Create Radial Gradients (Middle to Outer)
                const defs = svg.append("defs");
                data.forEach((d, i) => {
                    const grad = defs.append("radialGradient")
                        .attr("id", `radial-${i}`)
                        .attr("cx", "0").attr("cy", "0").attr("r", "100%")
                        .attr("gradientUnits", "userSpaceOnUse");

                    // The "Glow" effect
                    grad.append("stop").attr("offset", "30%").attr("stop-color", "#fff").attr("stop-opacity", 0.7);
                    grad.append("stop").attr("offset", "100%").attr("stop-color", palette[i % palette.length]);
                });

                const pie = d3.pie().value(v => v.value).padAngle(0.04);
                const arc = d3.arc().innerRadius(radius * 0.7).outerRadius(radius).cornerRadius(15);

                svg.selectAll("path").data(pie(data)).enter().append("path")
                    .attr("d", arc)
                    .attr("fill", (d, i) => `url(#radial-${i})`);

                // Display Total in Middle
                const total = d3.sum(data, d => d.value);
                svg.append("text").attr("class", "center-val").attr("dy", "0.1em")
                    .style("font-size", (radius * 0.25) + "px").text(total.toLocaleString());
                
                svg.append("text").attr("class", "center-label").attr("dy", "2.2em").text("Grand Total");
            };

            render();
            // Listen for changes
            const ws = tableau.extensions.dashboardContent.dashboard.worksheets[0];
            ws.addEventListener(tableau.TableauEventType.FilterChanged, render);
            window.onresize = render;
        });
    </script>
</body>
</html>
