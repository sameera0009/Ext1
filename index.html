<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Donut by Sameera</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0e14; --neon: #00f2ff; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; 
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .arc { cursor: pointer; transition: 0.3s; stroke-linejoin: round; }
        .arc:hover { filter: brightness(1.5) drop-shadow(0 0 12px var(--neon)); }
        .center-val { fill: white; font-weight: bold; text-anchor: middle; text-shadow: 0 0 15px var(--neon); }
        .center-lab { fill: #666; font-size: 11px; text-anchor: middle; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        'use strict';
        (function () {
            let worksheet;
            window.onload = tableau.extensions.initializeAsync().then(() => {
                worksheet = tableau.extensions.worksheetContent.worksheet;
                const update = async () => {
                    const reader = await worksheet.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });
                    const page = await reader.getPageAsync(0);
                    const spec = await worksheet.getVisualSpecificationAsync();
                    
                    const map = {};
                    spec.marksSpecifications[spec.activeMarksSpecificationIndex].encodings.forEach(e => { map[e.id] = e.field; });

                    // Ensure we only process if the core data fields are present
                    if (!map.angle || !map.color) return;

                    const raw = page.data.map(r => ({
                        val: parseFloat(r[map.angle.index].nativeValue) || 0,
                        lab: r[map.color.index].formattedValue
                    }));

                    const data = Array.from(d3.rollup(raw, v => d3.sum(v, d => d.val), d => d.lab), ([lab, val]) => ({ lab, val }));
                    render(data, d3.sum(data, d => d.val));
                    await reader.releaseAsync();
                };
                worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, update);
                onresize = update; update();
            });

            function render(data, total) {
                const svgContainer = d3.select("#content");
                svgContainer.selectAll("*").remove();
                if (data.length === 0) return;

                const w = window.innerWidth, h = window.innerHeight;
                const r = Math.min(w, h) / 2.8;
                const svg = svgContainer.append("svg").attr("width", w).attr("height", h).append("g").attr("transform", `translate(${w/2},${h/2})`);

                const colors = d3.scaleOrdinal().range(["#00f2ff", "#ff007c", "#7000ff", "#00ff95", "#ffcf00"]);
                const pie = d3.pie().value(d => d.val).padAngle(0.05);
                const arc = d3.arc().innerRadius(r * 0.72).outerRadius(r).cornerRadius(12);

                svg.selectAll("path").data(pie(data)).enter().append("path")
                    .attr("class", "arc").attr("d", arc)
                    .attr("fill", d => colors(d.data.lab))
                    .style("stroke", "#0b0e14").style("stroke-width", "4px")
                    .on("mouseover", (e, d) => {
                        svg.select(".center-val").text(d.data.val.toLocaleString());
                        svg.select(".center-lab").text(d.data.lab);
                    })
                    .on("mouseout", () => {
                        svg.select(".center-val").text(total.toLocaleString());
                        svg.select(".center-lab").text("TOTAL");
                    });

                svg.append("text").attr("class", "center-val").attr("dy", "0.1em").style("font-size", (r*0.2)+"px").text(total.toLocaleString());
                svg.append("text").attr("class", "center-lab").attr("dy", "2.2em").text("TOTAL");
            }
        })();
    </script>
</body>
</html>
