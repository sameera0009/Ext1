<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Gradient Donut</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api-js@main/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow: hidden; background-color: transparent; }
        #chart-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
        .center-label { font-weight: bold; fill: #333; text-anchor: middle; transition: all 0.3s ease; }
        .slice:hover { filter: brightness(1.1); cursor: pointer; }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        tableau.extensions.initializeAsync().then(() => {
            renderChart();
        });

        async function renderChart() {
            const worksheet = tableau.extensions.dashboardContent.dashboard.worksheets[0];
            const dataTable = await worksheet.getSummaryDataAsync();
            
            // Mocking data structure for demo - Map your Tableau columns here
            const data = dataTable.data.map(row => ({
                name: row[0].formattedValue,
                value: row[1].value,
                // In a real scenario, you could pull hex codes from a 3rd column
                color: "#" + Math.floor(Math.random()*16777215).toString(16) 
            }));

            const width = 400, height = 400, margin = 40;
            const radius = Math.min(width, height) / 2 - margin;

            d3.select("#chart-container").selectAll("*").remove();
            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${width / 2}, ${height / 2})`);

            // 1. Create Gradients
            const defs = svg.append("defs");
            data.forEach((d, i) => {
                const grad = defs.append("radialGradient")
                    .attr("id", `grad-${i}`)
                    .attr("cx", "0").attr("cy", "0").attr("r", "100%")
                    .attr("gradientUnits", "userSpaceOnUse");

                // Middle (light/white-ish for glow) to Outer (Slice Color)
                grad.append("stop").attr("offset", "30%").attr("stop-color", "white").attr("stop-opacity", 0.3);
                grad.append("stop").attr("offset", "100%").attr("stop-color", d.color);
            });

            // 2. Shape Logic
            const pie = d3.pie().value(d => d.value).sort(null);
            const arc = d3.arc().innerRadius(radius * 0.65).outerRadius(radius).cornerRadius(8);

            // 3. Draw Slices
            svg.selectAll('path')
                .data(pie(data))
                .enter()
                .append('path')
                .attr('d', arc)
                .attr('fill', (d, i) => `url(#grad-${i})`)
                .attr("class", "slice")
                .style("stroke", "white")
                .style("stroke-width", "2px");

            // 4. Center Label
            const total = d3.sum(data, d => d.value);
            svg.append("text")
                .attr("class", "center-label")
                .attr("dy", "0.35em")
                .style("font-size", "24px")
                .text(total.toLocaleString());
            
            svg.append("text")
                .attr("dy", "2em")
                .style("text-anchor", "middle")
                .style("font-size", "12px")
                .style("fill", "#999")
                .text("TOTAL");
        }
    </script>
</body>
</html>
