<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern KPI Card</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --bg-card: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #f3f4f6; font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        #card {
            width: 90%; max-width: 400px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .header { font-size: 0.9rem; color: var(--text-sub); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        .main-value { font-size: 2.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }

        .comparison { font-size: 0.95rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

        .progress-container {
            width: 100%; height: 8px; background: #e5e7eb;
            border-radius: 10px; overflow: hidden; position: relative;
        }

        .progress-bar { height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .status-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
            display: inline-block; margin-top: 15px;
        }

        /* Dynamic Classes */
        .is-success { color: var(--success); }
        .bg-success { background: var(--success); }
        .badge-success { background: #d1fae5; color: var(--success); }

        .is-danger { color: var(--danger); }
        .bg-danger { background: var(--danger); }
        .badge-danger { background: #fee2e2; color: var(--danger); }
    </style>
</head>
<body>

    <div id="card">
        <div class="header" id="ui-header">Loading...</div>
        <div class="main-value" id="ui-actual">--</div>
        <div class="comparison" id="ui-comparison">
            <span>vs Budget: <b id="ui-budget">--</b></span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="ui-progress"></div>
        </div>
        <div id="ui-badge" class="status-badge">PENDING</div>
    </div>

    <script>
        'use strict';

        (function () {
            tableau.extensions.initializeAsync().then(() => {
                const update = async () => {
                    const worksheet = tableau.extensions.worksheetContent.worksheet;
                    const spec = await worksheet.getVisualSpecificationAsync();
                    
                    // Map encodings
                    const map = {};
                    if (spec.activeMarksSpecificationIndex >= 0) {
                        spec.marksSpecifications[spec.activeMarksSpecificationIndex].encodings.forEach(e => {
                            map[e.id] = e.field.name;
                        });
                    }

                    const reader = await worksheet.getSummaryDataReaderAsync();
                    const page = await reader.getPageAsync(0);
                    const data = page.data[0]; // Take first row
                    const columns = page.columns;

                    const getVal = (id) => {
                        const idx = columns.findIndex(c => c.fieldName === map[id]);
                        return idx !== -1 ? data[idx] : null;
                    };

                    const actual = getVal('actual')?.nativeValue || 0;
                    const budget = getVal('budget')?.nativeValue || 0;
                    const header = getVal('header')?.formattedValue || "Performance";

                    render(actual, budget, header);
                    await reader.releaseAsync();
                };

                worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, update);
                update();
            });

            function render(act, bud, head) {
                const percent = (act / bud) * 100;
                const isAchieved = act >= bud;
                const colorClass = isAchieved ? 'success' : 'danger';

                document.getElementById('ui-header').innerText = head;
                document.getElementById('ui-actual').innerText = act.toLocaleString(undefined, {style: 'currency', currency: 'USD', maximumFractionDigits: 0});
                document.getElementById('ui-budget').innerText = bud.toLocaleString(undefined, {style: 'currency', currency: 'USD', maximumFractionDigits: 0});
                
                const bar = document.getElementById('ui-progress');
                bar.style.width = Math.min(percent, 100) + '%';
                bar.className = `progress-bar bg-${colorClass}`;

                const badge = document.getElementById('ui-badge');
                badge.innerText = isAchieved ? 'TARGET ACHIEVED' : 'BELOW BUDGET';
                badge.className = `status-badge badge-${colorClass}`;
            }
        })();
    </script>
</body>
</html>
