<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>KPI Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --edge-color:#6366F1;
  --pos:#10b981;
  --neg:#ef4444;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;
  font-family:'Inter',sans-serif;
}
#app{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.card{
  background:#fff;
  border-radius:20px;
  width:min(340px,100%);
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.04),0 12px 32px rgba(0,0,0,0.08);
  position:relative;
}
.top-edge{
  height:4px;width:100%;
  background:var(--edge-color);
  transition:background 0.3s;
}
.body{padding:18px 20px 16px;}

/* header */
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.label{
  font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:#94a3b8;flex:1;
}
.vbadge{
  display:inline-flex;align-items:center;gap:3px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;
  padding:3px 9px 3px 6px;border-radius:20px;
  transition:all 0.25s;
}
.vbadge.up{background:#dcfce7;color:var(--pos);}
.vbadge.down{background:#fee2e2;color:var(--neg);}
.vbadge svg{width:11px;height:11px;}

/* hero */
.hero{
  font-size:clamp(32px,8vw,42px);font-weight:800;
  color:#0f172a;letter-spacing:-2px;line-height:1;
  margin:4px 0 6px;
  font-feature-settings:"tnum";
}

/* mom */
.mrow{display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.mdelta{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
.mdelta.up{color:var(--pos);}
.mdelta.down{color:var(--neg);}
.mlabel{font-size:11px;color:#94a3b8;}

/* chart */
.cwrap{width:100%;height:70px;position:relative;}
svg.spark{width:100%;height:100%;display:block;}

.xlabs{display:flex;justify-content:space-between;padding:4px 0 0;margin-top:2px;}
.xlabs span{font-size:9px;color:#cbd5e1;font-weight:600;}

/* tooltip */
.tt{
  position:fixed;pointer-events:none;opacity:0;
  background:#1e293b;color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:7px 11px;border-radius:8px;z-index:999;
  white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.25);
  transition:opacity .12s;
}

/* empty */
.empty{
  padding:32px 20px;text-align:center;
  font-size:12px;color:#94a3b8;line-height:1.8;
  display:none;
}
.empty strong{color:var(--edge-color);}
</style>
</head>
<body>
<div id="app">
  <div class="card" id="card">
    <div class="top-edge" id="topEdge"></div>
    <div class="body" id="cardBody">
      <div class="hrow">
        <span class="label" id="klabel">Metric</span>
        <span class="vbadge up" id="vbadge">
          <svg id="vicon" viewBox="0 0 12 12" fill="none">
            <path d="M6 9V3M6 3L3 6M6 3l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="vpct">—</span>
        </span>
      </div>
      <div class="hero" id="hero">—</div>
      <div class="mrow">
        <span class="mdelta up" id="mdelta">—</span>
        <span class="mlabel">vs prev period</span>
      </div>
      <div class="cwrap">
        <svg class="spark" id="spark"></svg>
      </div>
      <div class="xlabs" id="xlabs"></div>
    </div>
    <div class="empty" id="empty">
      Drop a <strong>Measure</strong> on <em>Value</em><br>
      and a <strong>Date</strong> on <em>Period</em>
    </div>
  </div>
</div>
<div class="tt" id="tt"></div>

<script>
'use strict';
(function(){

  let CFG={edgeColor:'#6366F1'};
  let sparkPts=[];
  let ws;

  function loadCfg(){
    try{
      const raw=tableau.extensions.settings.get('kpiCfg');
      if(raw) Object.assign(CFG,JSON.parse(raw));
    }catch{}
  }

  function applyEdgeColor(){
    document.documentElement.style.setProperty('--edge-color',CFG.edgeColor);
  }

  window.onload=function(){
    tableau.extensions.initializeAsync({configure:openConfig}).then(()=>{
      ws=tableau.extensions.worksheetContent.worksheet;
      loadCfg();
      applyEdgeColor();

      const go=()=>load(ws);
      ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,go);
      window.addEventListener('resize',()=>{ if(sparkPts.length) drawChart(); });

      tableau.extensions.settings.addEventListener(
        tableau.TableauEventType.SettingsChanged,
        ()=>{ loadCfg(); applyEdgeColor(); if(sparkPts.length) drawChart(); }
      );

      go();
    }).catch(showEmpty);
  };

  function openConfig(){
    const url=window.location.href.replace('kpi-card.html','config.html');
    tableau.extensions.ui.displayDialogAsync(url,'',{width:360,height:480})
      .catch(()=>{});
  }

  async function load(wsObj){
    try{
      const [rows,enc]=await Promise.all([readRows(wsObj),readEnc(wsObj)]);
      renderCard(rows,enc);
    }catch{ showEmpty(); }
  }

  async function readRows(wsObj){
    let rows=[];
    const r=await wsObj.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(let i=0;i<r.pageCount;i++){
      const pg=await r.getPageAsync(i);
      pg.data.forEach(row=>{
        const o={};
        pg.columns.forEach((c,idx)=>{o[c.fieldName]=row[idx];});
        rows.push(o);
      });
    }
    await r.releaseAsync();
    return rows;
  }

  async function readEnc(wsObj){
    const spec=await wsObj.getVisualSpecificationAsync();
    const map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    const m=spec.marksSpecifications[spec.activeMarksSpecificationIndex];
    m.encodings.forEach(e=>{map[e.id]=e.field;});
    return map;
  }

  function renderCard(rows,enc){
    if(!enc.value||rows.length===0){ showEmpty(); return; }
    hideEmpty();

    const vf=enc.value.name;
    const pf=enc.period?enc.period.name:null;

    document.getElementById('klabel').textContent=vf.replace(/^(sum|avg|count|min|max)\((.+)\)$/i,'$2');

    let series=rows.map(r=>({
      v:parseFloat(r[vf]?.nativeValue)||0,
      p:pf?(r[pf]?.formattedValue||''):''
    }));
    if(pf) series.sort((a,b)=>a.p.localeCompare(b.p,undefined,{numeric:true}));

    const vals=series.map(s=>s.v);
    const labs=series.map(s=>s.p);
    const last=vals.at(-1)||0;
    const prev=vals.length>1?vals.at(-2):null;

    document.getElementById('hero').textContent=fmt(last);

    if(prev!==null){
      const diff=last-prev;
      const pct=prev!==0?(diff/Math.abs(prev))*100:0;
      const up=diff>=0;
      const badge=document.getElementById('vbadge');
      badge.className='vbadge '+(up?'up':'down');
      document.getElementById('vpct').textContent=(up?'+':'')+pct.toFixed(1)+'%';
      document.getElementById('vicon').innerHTML=up
        ?'<path d="M6 9V3M6 3L3 6M6 3l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
        :'<path d="M6 3v6M6 9L3 6m3 3l3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';

      const md=document.getElementById('mdelta');
      md.className='mdelta '+(up?'up':'down');
      md.textContent=(up?'▲ +':'▼ ')+fmt(Math.abs(diff))+'  ('+(up?'+':'')+pct.toFixed(1)+'%)';
    }

    const xl=document.getElementById('xlabs');
    xl.innerHTML='';
    if(labs.length>1){
      [labs[0],labs[Math.floor(labs.length/2)],labs.at(-1)].filter(Boolean).forEach(l=>{
        const sp=document.createElement('span');sp.textContent=l;xl.appendChild(sp);
      });
    }

    sparkPts=vals.map((v,i)=>({v,label:labs[i]||String(i+1)}));
    drawChart();
  }

  function drawChart(){
    const svgEl=document.getElementById('spark');
    d3.select(svgEl).selectAll('*').remove();
    if(sparkPts.length<2) return;

    const W=svgEl.clientWidth||300;
    const H=70;
    const p={t:6,r:6,b:4,l:6};
    const vs=sparkPts.map(d=>d.v);
    const xSc=d3.scaleLinear().domain([0,vs.length-1]).range([p.l,W-p.r]);
    const mn=d3.min(vs),mx=d3.max(vs),mg=(mx-mn)*0.1||1;
    const ySc=d3.scaleLinear().domain([mn-mg,mx+mg]).range([H-p.b,p.t]);
    const svg=d3.select(svgEl);
    const uid='g'+Date.now();

    const defs=svg.append('defs');
    const gr=defs.append('linearGradient').attr('id',uid)
      .attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
    gr.append('stop').attr('offset','0%').attr('stop-color',CFG.edgeColor).attr('stop-opacity',0.4);
    gr.append('stop').attr('offset','100%').attr('stop-color',CFG.edgeColor).attr('stop-opacity',0.0);

    const curve=d3.curveCatmullRom.alpha(0.5);
    svg.append('path').datum(vs)
      .attr('d',d3.area().x((_,i)=>xSc(i)).y0(H-p.b).y1(d=>ySc(d)).curve(curve))
      .attr('fill',`url(#${uid})`);

    svg.append('path').datum(vs)
      .attr('d',d3.line().x((_,i)=>xSc(i)).y(d=>ySc(d)).curve(curve))
      .attr('fill','none').attr('stroke',CFG.edgeColor).attr('stroke-width',2.5).attr('stroke-linecap','round');

    svg.append('circle')
      .attr('cx',xSc(vs.length-1)).attr('cy',ySc(vs.at(-1))).attr('r',4)
      .attr('fill',CFG.edgeColor).attr('stroke','#fff').attr('stroke-width',2);

    const tt=document.getElementById('tt');
    const vl=svg.append('line').attr('y1',p.t).attr('y2',H-p.b)
      .attr('stroke','#e2e8f0').attr('stroke-width',1).attr('stroke-dasharray','3,2').style('opacity',0);
    const vd=svg.append('circle').attr('r',4)
      .attr('fill',CFG.edgeColor).attr('stroke','#fff').attr('stroke-width',2).style('opacity',0);

    svg.append('rect').attr('width',W).attr('height',H).attr('fill','transparent').style('cursor','crosshair')
      .on('mousemove',function(e){
        const [mx]=d3.pointer(e,svgEl);
        const ci=Math.max(0,Math.min(vs.length-1,Math.round(xSc.invert(mx))));
        vl.attr('x1',xSc(ci)).attr('x2',xSc(ci)).style('opacity',1);
        vd.attr('cx',xSc(ci)).attr('cy',ySc(vs[ci])).style('opacity',1);
        tt.style('opacity',1)
          .style('left',(e.clientX+14)+'px').style('top',(e.clientY-32)+'px')
          .innerHTML=`<b>${sparkPts[ci].label}</b>&nbsp;&nbsp;${fmt(vs[ci])}`;
      })
      .on('mouseleave',()=>{ vl.style('opacity',0); vd.style('opacity',0); tt.style('opacity',0); });
  }

  function fmt(v){
    if(Math.abs(v)>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
    if(Math.abs(v)>=1e6) return '$'+(v/1e6).toFixed(2)+'M';
    if(Math.abs(v)>=1e3) return '$'+(v/1e3).toFixed(1)+'K';
    return '$'+v.toLocaleString(undefined,{maximumFractionDigits:1});
  }

  function showEmpty(){ document.getElementById('cardBody').style.display='none'; document.getElementById('empty').style.display='block'; }
  function hideEmpty(){ document.getElementById('cardBody').style.display=''; document.getElementById('empty').style.display='none'; }

})();
</script>
</body>
</html>
