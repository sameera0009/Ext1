<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Futuristic Neon Donut</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0e14; --cyan: #00f2ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        #viz { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .arc:hover { filter: brightness(1.5) drop-shadow(0 0 10px var(--cyan)); cursor: pointer; }
        .center-label { fill: white; font-weight: bold; text-shadow: 0 0 15px var(--cyan); text-anchor: middle; }
    </style>
</head>
<body>
    <div id="viz"></div>
    <script>
        'use strict';
        (function () {
            let worksheet;

            window.onload = tableau.extensions.initializeAsync().then(() => {
                worksheet = tableau.extensions.worksheetContent.worksheet;
                fetchAndDraw();
                worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, fetchAndDraw);
            });

            async function fetchAndDraw() {
                const reader = await worksheet.getSummaryDataReaderAsync();
                const page = await reader.getAllPagesAsync();
                
                // DATA CLEANING: Logic to ensure we have a valid Number and a valid Label
                const processedData = page.data.map(row => {
                    // Try to find which column is the number (nativeValue)
                    const val0 = parseFloat(row[0].nativeValue);
                    const val1 = parseFloat(row[1].nativeValue);

                    return {
                        value: isNaN(val0) ? (isNaN(val1) ? 0 : val1) : val0,
                        label: isNaN(val0) ? row[0].formattedValue : row[1].formattedValue
                    };
                }).filter(d => d.value > 0);

                // Group by Category (Rollup)
                const finalData = Array.from(
                    d3.rollup(processedData, v => d3.sum(v, d => d.value), d => d.label),
                    ([label, value]) => ({ label, value })
                );

                renderChart(finalData);
                await reader.releaseAsync();
            }

            function renderChart(data) {
                const container = d3.select("#viz");
                container.selectAll("*").remove();
                if (data.length === 0) return;

                const w = window.innerWidth, h = window.innerHeight;
                const radius = Math.min(w, h) / 2.8;
                const svg = container.append("svg").attr("width", w).attr("height", h)
                             .append("g").attr("transform", `translate(${w/2},${h/2})`);

                const colors = d3.scaleOrdinal().range(["#00f2ff", "#7000ff", "#ff007c", "#00ff95", "#ffcf00"]);
                const pie = d3.pie().value(d => d.value).padAngle(0.05);
                const arc = d3.arc().innerRadius(radius * 0.7).outerRadius(radius).cornerRadius(12);

                svg.selectAll("path").data(pie(data)).enter().append("path")
                   .attr("class", "arc").attr("d", arc).attr("fill", d => colors(d.data.label))
                   .style("stroke", "#0b0e14").style("stroke-width", "4px");

                svg.append("text").attr("class", "center-label").attr("dy", "0.35em")
                   .style("font-size", (radius * 0.15) + "px").text("ANALYSIS");
            }
            window.onresize = fetchAndDraw;
        })();
    </script>
</body>
</html>
