<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Banking Extension</title>

  <script src="https://cdn.jsdelivr.net/npm/@tableau/extensions-api@1.11.0/dist/tableau.extensions.1.latest.js"></script>
</head>

<body>
  <h3>Banking Dashboard Extension</h3>
  <button onclick="load()">Load Data</button>
  <div id="out">Not connected</div>

  <script>
    let dashboard;

    tableau.extensions.initializeAsync().then(() => {
      dashboard = tableau.extensions.dashboardContent.dashboard;
      document.getElementById("out").innerText = "Connected ✔";
    });

    function load() {
      dashboard.worksheets[0].getSummaryDataAsync().then(data => {
        document.getElementById("out").innerText =
          "Rows: " + data.totalRowCount;
      });
    }
  </script>
</body>
</html>
